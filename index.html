<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="我的课表" />
    <meta name="description" content="按周查看课程、时间和教室的离线课表应用" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>我的课表</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <div>
            <p class="eyebrow">2026 秋季学期</p>
            <h1>我的课表</h1>
          </div>
          <button class="icon-button" id="installButton" type="button" aria-label="安装说明">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
          </button>
        </div>
        <p id="offlineStatus" class="offline-status is-preparing" role="status" aria-live="polite">正在准备离线使用…</p>

        <div class="week-picker" aria-label="选择周次">
          <button id="previousWeek" type="button" aria-label="上一周">‹</button>
          <label>
            <span class="sr-only">周次</span>
            <select id="weekSelect"></select>
          </label>
          <button id="nextWeek" type="button" aria-label="下一周">›</button>
        </div>
        <p id="weekDates" class="week-dates"></p>
      </header>

      <nav id="dayNav" class="day-nav" aria-label="星期导航"></nav>

      <main>
        <section id="statusCard" class="status-card" hidden></section>
        <div id="schedule" class="schedule" aria-live="polite"></div>

        <section class="floating-courses" aria-labelledby="floatingTitle">
          <div class="section-heading">
            <div>
              <p class="section-kicker">线上 / 不排时间</p>
              <h2 id="floatingTitle">自主安排课程</h2>
            </div>
          </div>
          <div id="floatingCourseList"></div>
        </section>
      </main>
    </div>

    <dialog id="installDialog">
      <form method="dialog">
        <button class="dialog-close" aria-label="关闭">×</button>
        <div class="install-icon">↗</div>
        <h2>添加到 iPhone 主屏幕</h2>
        <ol>
          <li>用 Safari 打开本课表的网址。</li>
          <li>等待页面顶部显示“离线可用”。</li>
          <li>点击底部工具栏的“分享”按钮。</li>
          <li>选择“添加到主屏幕”，再点击“添加”。</li>
        </ol>
        <p>安装后可像普通 App 一样打开；访问过一次后也可离线查看。</p>
        <button class="primary-button" value="close">知道了</button>
      </form>
    </dialog>

    <noscript>此课表需要启用 JavaScript。</noscript>
    <script src="app.js" defer></script>
  </body>
</html>
